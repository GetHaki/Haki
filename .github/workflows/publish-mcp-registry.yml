name: Publish to official MCP Registry

on:
  push:
    branches: [main]
    paths: ['server.json']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mp.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.1.0/mcp-publisher_1.1.0_linux_amd64.tar.gz
          tar -xzf mp.tar.gz mcp-publisher

      - name: Login via GitHub OIDC and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
