services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: haki
      POSTGRES_PASSWORD: haki
      POSTGRES_DB: haki
    ports:
      # 5433 cote hote : un Postgres Windows local occupe deja 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haki -d haki"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
