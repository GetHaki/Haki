[project]
name = "haki-api"
version = "0.1.0"
description = "Haki -- long-term memory layer for AI agents (Ledger, Consolidator, Context, forget, Cursor MCP server)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pgvector>=0.5.0",
    "httpx>=0.28.1",
    "fastembed>=0.4",
    "mcp>=2.0.0",
    # CLI device-code auth flow (sprint 14): short-lived pending/approved
    # state, native TTL, no Postgres table. redis.asyncio, not the
    # deprecated aioredis.
    "redis>=5.0",
    # The gateway renders the <haki_memory> block with the SDK's
    # build_prompt_context: one implementation, no divergent copy.
    # Distribution name is "gethaki" (haki was already taken on PyPI) --
    # the importable module stays "haki" (sdk/python/src/haki/).
    "gethaki",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.uv.sources]
gethaki = { path = "sdk/python", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
