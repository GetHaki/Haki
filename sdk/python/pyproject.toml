[project]
name = "haki"
version = "0.1.0"
description = "Haki Python SDK — memoire long-terme pour agents IA (client, helpers runtime, CLI)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
]

[project.scripts]
haki = "haki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haki"]
