[project]
# Distribution/PyPI name only -- "haki" was already taken on PyPI by an
# unrelated project (checked 2026-08-02). The importable package stays
# `haki` (src/haki/, unchanged) and the installed command stays `haki`
# (see [project.scripts] below) -- only what you `pip install`/`uv add`
# changes.
name = "gethaki"
version = "0.1.3"
description = "Python SDK for Haki — long-term memory for AI agents, with proof"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Dicken AI" }]
keywords = ["ai", "agents", "memory", "llm", "rag", "context"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://gethaki.space"
Documentation = "https://docs.gethaki.space"
Repository = "https://github.com/GetHaki/Haki"
Issues = "https://github.com/GetHaki/Haki/issues"

[project.scripts]
haki = "haki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haki"]
